<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Optimizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Banner Optimizer</h1>
      <p class="subtitle">Генератор баннеров 1920×1080 с логотипом</p>
    </header>

    <main>
      <div class="upload-section">
        <!-- Covers -->
        <div class="upload-card" id="covers-card">
          <div class="upload-icon">🖼️</div>
          <h2>Обложки</h2>
          <p>Фоновые изображения баннеров</p>
          <label class="upload-btn" for="covers-input">
            Выбрать обложки
          </label>
          <input type="file" id="covers-input" accept="image/*" multiple hidden>
          <div class="file-list" id="covers-list"></div>
        </div>

        <!-- Logos -->
        <div class="upload-card" id="logos-card">
          <div class="upload-icon">✨</div>
          <h2>Логотипы</h2>
          <p>Файлы логотипов (PNG с прозрачностью)</p>
          <label class="upload-btn" for="logos-input">
            Выбрать логотипы
          </label>
          <input type="file" id="logos-input" accept="image/*" multiple hidden>
          <div class="file-list" id="logos-list"></div>
        </div>
      </div>

      <!-- Pairing mode -->
      <div class="options-section">
        <h3>Режим создания баннеров</h3>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="mode" value="pairs" checked>
            <span>По порядку (1-я обложка + 1-й логотип, 2-я + 2-й...)</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="mode" value="all">
            <span>Все комбинации (каждая обложка × каждый логотип)</span>
          </label>
        </div>
      </div>

      <!-- Generate -->
      <div class="action-section">
        <button id="generate-btn" class="generate-btn" disabled>
          Создать баннеры
        </button>
        <div id="progress-wrap" class="progress-wrap hidden">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span id="progress-text">0 / 0</span>
        </div>
      </div>

      <!-- Preview -->
      <div id="preview-section" class="preview-section hidden">
        <h3>Предпросмотр (<span id="preview-count">0</span> баннеров)</h3>
        <div class="preview-grid" id="preview-grid"></div>
        <button id="download-btn" class="download-btn">
          ⬇️ Скачать все как ZIP
        </button>
      </div>
    </main>

    <!-- Hidden canvas for rendering -->
    <canvas id="render-canvas" width="1920" height="1080" style="display:none"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
