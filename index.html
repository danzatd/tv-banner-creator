<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Optimizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Banner Optimizer</h1>
      <p class="subtitle">Генератор баннеров 1920×1080 с логотипом</p>
    </header>

    <main>
      <div class="upload-section">
        <!-- Covers -->
        <div class="upload-card" id="covers-card">
          <div class="upload-icon">🖼️</div>
          <h2>Обложки</h2>
          <p>Фоновые изображения баннеров</p>
          <label class="upload-btn" for="covers-input">Выбрать обложки</label>
          <input type="file" id="covers-input" accept="image/*" multiple hidden>
          <div class="file-list" id="covers-list"></div>
        </div>

        <!-- Logos -->
        <div class="upload-card" id="logos-card">
          <div class="upload-icon">✨</div>
          <h2>Логотипы</h2>
          <p>Файлы логотипов (PNG с прозрачностью)</p>
          <label class="upload-btn" for="logos-input">Выбрать логотипы</label>
          <input type="file" id="logos-input" accept="image/*" multiple hidden>
          <div class="file-list" id="logos-list"></div>
        </div>
      </div>

      <!-- Pairing mode -->
      <div class="options-section">
        <h3>Режим создания баннеров</h3>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="mode" value="pairs" checked>
            <span>По порядку (1-я обложка + 1-й логотип, 2-я + 2-й...)</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="mode" value="all">
            <span>Все комбинации (каждая обложка × каждый логотип)</span>
          </label>
        </div>
      </div>

      <!-- Preview -->
      <div id="preview-section" class="preview-section hidden">
        <div class="preview-header">
          <h3>Предпросмотр <span class="preview-count-badge" id="preview-count"></span></h3>
          <button id="download-btn" class="download-btn">⬇️ Скачать все как ZIP</button>
        </div>
        <div id="rendering-notice" class="rendering-notice hidden">Генерация...</div>
        <div class="preview-grid" id="preview-grid"></div>
      </div>
    </main>

    <!-- Canvases -->
    <canvas id="preview-canvas" style="display:none"></canvas>
    <canvas id="render-canvas" width="1920" height="1080" style="display:none"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
